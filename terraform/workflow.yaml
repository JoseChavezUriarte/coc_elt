main:
  steps:
    - run_job:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: "projects/${compute_project_id}/locations/${region}/jobs/coc-elt-job"
        result: operation
    - wait_job:
        call: googleapis.run.v2.projects.locations.operations.get
        args:
          name: $${operation.name}
        result: op_status
    - check_job_status:
        switch:
          - condition: $${op_status.done == true}
            next: check_job_error
        next: wait_and_poll
    - wait_and_poll:
        call: sys.sleep
        args:
          seconds: 10
        next: wait_job
    - check_job_error:
        switch:
          - condition: $${"error" in op_status}
            raise: $${op_status.error}
        next: get_max_date_from_bq
    - get_max_date_from_bq:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: "${data_project_id}"
          body:
            query: "SELECT FORMAT_TIMESTAMP('%Y-%m-%dT%H:%M:%SZ', MAX(extracted_date)) AS max_date FROM `${data_project_id}.coc_silver.clan_member_upgrades`"
            useLegacySql: false
        result: bq_result
        next: validate_bq_result
    - validate_bq_result:
        switch:
          - condition: $${not("rows" in bq_result) or len(bq_result.rows) == 0 or bq_result.rows[0].f[0].v == null}
            raise: "Operational Error: The clan_member_upgrades table is empty or the MAX() value is null."
        next: compile_dataform
    - compile_dataform:
        call: http.post
        args:
          url: https://dataform.googleapis.com/v1beta1/projects/${data_project_id}/locations/${region}/repositories/coc-elt/compilationResults
          auth:
            type: OAuth2
          body:
            gitCommitish: "main"
            codeCompilationConfig:
              defaultDatabase: "${data_project_id}"
              vars:
                execution_timestamp: $${bq_result.rows[0].f[0].v}
        result: compilation
    - run_dataform:
        call: http.post
        args:
          url: https://dataform.googleapis.com/v1beta1/projects/${data_project_id}/locations/${region}/repositories/coc-elt/workflowInvocations
          auth:
            type: OAuth2
          body:
            compilationResult: $${compilation.body.name}
        result: df_invocation
    - wait_dataform:
        call: sys.sleep
        args:
          seconds: 15
        next: get_dataform_status
    - get_dataform_status:
        call: http.get
        args:
          url: '$${"https://dataform.googleapis.com/v1beta1/" + df_invocation.body.name}'
          auth:
            type: OAuth2
        result: df_status
    - check_dataform_status:
        switch:
          - condition: $${df_status.body.state == "SUCCEEDED"}
            next: return_result
          - condition: $${df_status.body.state == "FAILED" or df_status.body.state == "CANCELLED"}
            next: raise_dataform_error
        next: wait_dataform
    - raise_dataform_error:
        raise: '$${"Dataform workflow invocation " + df_status.body.name + " finished with state: " + df_status.body.state}'
    - return_result:
        return: $${df_status.body}
